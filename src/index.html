<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PageSmith PDF</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="brand"><img class="brand-mark" src="pagesmith-mark.png" alt="" /><span class="brand-name">PageSmith PDF</span></div>
        </div>
        <div class="nav-section">
          <p class="section-label" data-i18n="tools">Werkzeuge</p>
          <nav id="tool-nav" aria-label="PDF-Werkzeuge"></nav>
        </div>
        <div class="sidebar-settings">
          <div class="language-control"><span data-i18n="language">Sprache</span><div id="language-select"></div></div>
          <div class="conflict-control"><span data-i18n="conflictHandling">Bei gleichem Dateinamen</span><div id="conflict-select"></div></div>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div class="topbar-copy"><h1 id="tool-title"></h1><p id="tool-description" class="muted"></p></div>
          <div class="topbar-actions">
            <button id="reset-page" class="icon-button" type="button" title="Aktuelle Seite zurücksetzen" aria-label="Aktuelle Seite zurücksetzen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0 1.35 4.47"/><path d="M20 4v7h-7"/></svg><span class="reset-label" data-i18n="resetShort">Reset</span></button>
            <span id="app-version" class="app-version">v0.1.0</span>
          </div>
        </header>
        <section class="workspace">
          <ol id="workflow-status" class="workflow-status" aria-label="Auftragsfortschritt"><li data-step="files" data-i18n="files">Dateien</li><li data-step="options" data-i18n="options">Optionen</li><li data-step="destination" data-i18n="destination">Zielordner</li></ol>
          <section id="drop-zone" class="drop-zone" aria-labelledby="drop-heading">
            <div class="drop-zone-copy"><div class="drop-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg></div><div><h2 id="drop-heading" data-i18n="dropTitle">Dateien hier ablegen</h2><p id="drop-copy">oder über den Explorer auswählen</p></div></div>
            <button class="secondary" id="choose-files" type="button">Dateien auswählen</button>
          </section>
          <div id="file-list" class="file-list empty" role="list" aria-live="polite"><p>Noch keine Dateien ausgewählt.</p></div>
          <section class="options-card is-muted"><div class="card-heading"><div><h2 data-i18n="outputSettings">Ausgabe einstellen</h2><p id="option-summary" class="card-copy"></p></div><span id="file-count" class="count">0 Dateien</span></div><div id="options" class="option-fields"></div></section>
          <section class="destination-card"><div class="destination-copy"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l1.8 2H20a1 1 0 0 1 1 1v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5a1 1 0 0 1 .5-1Z"/><path d="M3.5 10h17"/></svg></span><div><h2 data-i18n="destination">Zielordner</h2><p id="destination-path" class="destination-path">Noch kein Ordner ausgewählt</p></div></div><button class="secondary" id="choose-folder" type="button" data-i18n="chooseFolder">Zielordner wählen</button></section>
          <div class="run-row"><div class="run-copy"><p id="run-hint" class="muted"></p></div><button id="run-button" class="primary" type="button" disabled>Ausführen</button></div>
          <section id="result-panel" class="result-panel" aria-live="polite" hidden></section>
        </section>
      </main>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
